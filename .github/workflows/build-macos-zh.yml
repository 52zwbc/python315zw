name: Build macOS 中文版安装包

# macOS universal2（arm64+x86_64）中文版 .dmg，发布到 v3.15.0-zh2
# 官方 build-installer.py 只产出 installer/Python.mpkg + diskimage/*.dmg，无单体 .pkg
# 触发：手动 workflow_dispatch（Release 已存在，直接追加附件）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建macOS universal2安装包(官方build-installer流程)
        run: |
          mkdir -p ~/Universal/other-sources
          # 预下载官方预编译文档(8MB)：buildPythonDocs 检测到后直接解包，
          # 跳过 make venv/make html，彻底避开 sphinx 工具链漂移。
          # 即使下载失败，build-installer.py 内已加 try/except 跳过文档，保证安装包必产出。
          curl -L --retry 3 -o ~/Universal/other-sources/python-3.15.0-docs-html.tar.bz2 \
            https://www.python.org/ftp/python/doc/3.15.0/python-3.15.0-docs-html.tar.bz2 || true
          ls -la ~/Universal/other-sources/ || true
          # 官方脚本内含相对路径（../../Doc、resources/...），必须在 Mac/BuildScript 下运行
          # --dep-target=10.13：与 python.org 3.15 最低要求对齐；默认 10.9 的 mpkg
          # 在 macOS 26 runner 上被 installer 判不兼容（This package is incompatible）。
          cd Mac/BuildScript
          python3 build-installer.py --universal-archs=universal2 --dep-target=10.13
          echo "=== installer 目录（Python.mpkg）==="
          ls -la /tmp/_py/installer/
          echo "=== diskimage 目录（*.dmg）==="
          ls -la /tmp/_py/diskimage/

      - name: 中文冒烟测试（staging二进制，不依赖系统安装）
        run: |
          MPKG=/tmp/_py/installer/Python.mpkg
          DMG=$(ls /tmp/_py/diskimage/*.dmg | head -1)
          echo "MPKG=$MPKG"
          echo "DMG=$DMG"
          ls -la /tmp/_py/installer/ /tmp/_py/diskimage/
          test -d "$MPKG" || { echo "Python.mpkg 不存在"; exit 1; }
          test -f "$DMG" || { echo "dmg 不存在"; exit 1; }
          # macOS 26 的 installer 拒收古董 bundle 式 mpkg（非中文改动问题），仅记录，不阻塞发布。
          # staging 二进制的 framework install_name 指向最终路径，故手动把 staging
          # framework 拷贝到 /Library（只放 Versions/3.15，不动 Current 链接），再测正式路径。
          sudo installer -pkg "$MPKG" -target / || echo "WARN: installer 拒收 bundle-mpkg（macOS 26 已知限制），改手动安装 framework"
          sudo mkdir -p /Library/Frameworks/Python.framework/Versions/3.15
          sudo cp -R /tmp/_py/_root/Library/Frameworks/Python.framework/Versions/3.15/* /Library/Frameworks/Python.framework/Versions/3.15/
          export PYTHONIOENCODING=utf-8
          # 测正式路径（二进制与 dmg 打包内容一致，3.15.0 含中文）；runner 自带旧版本无中文，不可用。
          FW=/Library/Frameworks/Python.framework/Versions/3.15/bin/python3
          test -x "$FW" || { echo "framework python 不存在"; exit 1; }
          echo "FW=$FW"
          $FW --version
          $FW -c "import sys; assert '3.15.0' in sys.version, sys.version"
          $FW -c "打印('hello-zh')"
          $FW test_zh.py
          echo '打印("banner-ok")' > banner_check.py
          $FW banner_check.py > banner_out.txt
          cat banner_out.txt
          grep "banner-ok" banner_out.txt
        shell: bash

      - name: 改名zh后缀并列出产物
        run: |
          DMG=$(ls /tmp/_py/diskimage/*.dmg | head -1)
          cp "$DMG" python-3.15.0-macos-zhv2.dmg || exit 1
          ls -la python-3.15.0-macos-zhv2.dmg
        shell: bash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: python315zw-macos-zh
          path: python-3.15.0-macos-zhv2.dmg

      - name: 追加到v3.15.0-zh2 Release
        run: |
          gh release view v3.15.0-zh2 >/dev/null 2>&1 || gh release create v3.15.0-zh2 --title "v3.15.0-zh2" --generate-notes || true
          gh release upload v3.15.0-zh2 python-3.15.0-macos-zhv2.dmg --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
